name: browser-flow
on: [push, pull_request]
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: supportdesk
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: supportdesk
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U supportdesk" --health-interval 2s --health-retries 30
      redis:
        image: redis:8.0.2-alpine
        ports: ["56379:6379"]
    env:
      UV_CACHE_DIR: /tmp/supportdesk-uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/playwright
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:5184"]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
      - run: uv sync --project apps/backend --locked --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @supportdesk/web exec playwright install --with-deps chromium ffmpeg
      - run: |
          uv run --all-extras alembic upgrade head
          uv run --all-extras python -m supportdesk.cli.seed_demo
          uv run --all-extras python -m supportdesk.cli.provision_embeddings
          uv run --all-extras python -m supportdesk.cli.seed_knowledge
        working-directory: apps/backend
      - run: |
          mkdir -p .local
          nohup bash scripts/dev.sh >.local/dev.log 2>&1 &
          uv run --project apps/backend --all-extras python -m supportdesk.cli.wait_demo
          pnpm --filter @supportdesk/web test:e2e
      - name: Verify production build with the Caddy CSP
        run: |
          pnpm build
          nohup pnpm --filter @supportdesk/web preview:csp >.local/csp-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5184/ >/dev/null; then break; fi
            sleep 1
          done
          CSP_BASE_URL=http://localhost:5184 pnpm --filter @supportdesk/web test:e2e e2e/production-csp.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            docs/evidence/*.png
            .local/dev.log
            .local/csp-preview.log
