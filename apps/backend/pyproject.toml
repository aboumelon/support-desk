[project]
name = "supportdesk"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2,<3", "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1", "redis>=6,<8",
  "celery[redis]>=5.6,<5.7", "pgvector>=0.4,<1", "python-multipart>=0.0.20,<1", "prometheus-client>=0.21,<1",
]
[project.optional-dependencies]
worker = ["sentence-transformers>=5,<6", "pypdf>=6,<7", "torch>=2.7,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "sentence_transformers.*", "huggingface_hub.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"
